[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxsce"
version = "0.0.1"
description = "Exact SCE strong-coupling functionals W_inf and W'_inf from correlated PySCF densities"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Gabriel Chirchir" }, { name = "Abhishek Bhattacharjee" },
  { name = "Subrata Jana" }, { name = "Szymon Smiga" },
]
dependencies = [
  "jax[cpu]==0.4.38", "jaxlib==0.4.38", "jaxopt", "numpy", "scipy>=1.13,<1.17",
  "pyscf", "basis-set-exchange", "dataclasses-json", "sympy", "sympy2jax",
  "tensorflow-probability==0.25.0", "psutil", "pandas", "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["jaxsce*"]
